      { id: "3g", name: "iPhone 3G", keywords: "3g 3.5 2008", year: 2008, inch: 3.5, connector: "30-pin Dock", era: "classic",
        caseGroup: "c_35_3g", camGroup: "cam_none", filmGroup: "f_35_3g", cableGroup: "dock30",
        note: "3.5インチ。iPhone 3GSと互換（30ピンコネクタ）。" },
      { id: "1st", name: "初代 iPhone (2G)", keywords: "1st 2g 初代 3.5 2007", year: 2007, inch: 3.5, connector: "30-pin Dock", era: "classic",
        caseGroup: "c_1st", camGroup: "cam_none", filmGroup: "f_1st", cableGroup: "dock30",
        note: "3.5インチ初代モデル（30ピンコネクタ）。" }
    ];

    let currentEra = 'latest';

    // グループ一致判定
    function compareGroup(a, b, fullProp, partialProp = null) {
      if (a.id === b.id) return 'full';
      if (a[fullProp] && b[fullProp] && a[fullProp] === b[fullProp]) return 'full';
      if (partialProp && a[partialProp] && b[partialProp] && a[partialProp] === b[partialProp]) return 'partial';
      return 'none';
    }

    function getCaseStatus(a, b) {
      if (a.id === b.id) return 'same';
      return compareGroup(a, b, 'caseGroup', 'casePartial');
    }

    function getItemStatuses(a, b) {
      return {
        caseSt: a.id === b.id ? 'full' : compareGroup(a, b, 'caseGroup', 'casePartial'),
        camSt: a.id === b.id ? 'full' : compareGroup(a, b, 'camGroup'),
        filmSt: a.id === b.id ? 'full' : compareGroup(a, b, 'filmGroup'),
        cableSt: a.id === b.id ? 'full' : compareGroup(a, b, 'cableGroup')
      };
    }

    function badgeHtml(st) {
      if (st === 'full') {
        return `<span class="inline-block px-3 py-1 rounded-full bg-emerald-100 text-emerald-700 font-extrabold text-sm">◎ 互換あり</span>`;
      }
      if (st === 'partial') {
        return `<span class="inline-block px-3 py-1 rounded-full bg-amber-100 text-amber-700 font-extrabold text-sm">△ 条件付き</span>`;
      }
      return `<span class="inline-block px-3 py-1 rounded-full bg-rose-100 text-rose-700 font-extrabold text-sm">× 非互換</span>`;
    }

    // 検索＆セレクトリスト絞り込み
    function filterModelList(side) {
      const inputEl = document.getElementById(`search-${side}`);
      const selectEl = document.getElementById(`model-${side}`);
      const q = inputEl.value.trim().toLowerCase();
      const prevVal = selectEl.value;

      const filtered = iphoneModels.filter(m => {
        if (!q) return true;
        return m.name.toLowerCase().includes(q) ||
               m.keywords.toLowerCase().includes(q) ||
               String(m.year).includes(q) ||
               String(m.inch).includes(q);
      });

      selectEl.innerHTML = '';
      filtered.forEach(m => {
        const opt = new Option(`${m.name} (${m.year}年 / ${m.inch}")`, m.id);
        selectEl.add(opt);
      });

      if (filtered.length > 0) {
        if (filtered.some(m => m.id === prevVal)) {
          selectEl.value = prevVal;
        } else {
          selectEl.selectedIndex = 0;
        }
      }
      checkCompatibility();
    }

    // 4項目別 判定描画
    function checkCompatibility() {
      const idA = document.getElementById('model-a').value;
      const idB = document.getElementById('model-b').value;
      const box = document.getElementById('result-box');

      if (!idA || !idB) {
        box.innerHTML = `<div class="p-6 rounded-xl bg-slate-100 text-center text-slate-600">該当する機種が見つかりません。検索条件を変えてください。</div>`;
        return;
      }

      const mA = iphoneModels.find(m => m.id === idA);
      const mB = iphoneModels.find(m => m.id === idB);

      document.getElementById('selected-label-a').textContent = `選択中：${mA.name}（${mA.year}年発売 / ${mA.inch}インチ / ${mA.connector}）`;
      document.getElementById('selected-label-b').textContent = `選択中：${mB.name}（${mB.year}年発売 / ${mB.inch}インチ / ${mB.connector}）`;

      const st = getItemStatuses(mA, mB);

      const items = [
        {
          title: "🛡️ ケース",
          status: st.caseSt,
          desc: st.caseSt === 'full' ? "外寸・ボタン・カメラ枠が一致" :
                st.caseSt === 'partial' ? "寸法や開口部により一部流用可" : "サイズ・ボタン・カメラ枠が不一致"
        },
        {
          title: "📷 カメラカバー",
          status: st.camSt,
          desc: st.camSt === 'full' ? "レンズ配置・台座形状が一致" : "レンズ数・配置・台座形状が不一致"
        },
        {
          title: "🖼️ 保護フィルム",
          status: st.filmSt,
          desc: st.filmSt === 'full' ? "画面サイズ・上部形状が一致" : "画面サイズ・ノッチ/島形状が不一致"
        },
        {
          title: "🔌 充電ケーブル",
          status: st.cableSt,
          desc: st.cableSt === 'full' ? `有線端子（${mA.connector}）が一致` : `${mA.connector} と ${mB.connector} で端子が異なります`
        }
      ];

      box.innerHTML = `
        <div class="p-4 md:p-5 rounded-xl bg-slate-50 border border-slate-200 mb-4 text-center">
          <div class="text-sm md:text-base font-bold text-slate-800">
            <span class="text-blue-700">${mA.name}</span>
            <span class="mx-2 text-slate-400">⇔</span>
            <span class="text-blue-700">${mB.name}</span>
          </div>
          <p class="text-xs text-slate-500 mt-1">
            ${mA.name}（${mA.year}年・${mA.inch}型） ／ ${mB.name}（${mB.year}年・${mB.inch}型）
          </p>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
          ${items.map(it => `
            <div class="p-4 rounded-xl border border-slate-200 bg-white flex flex-col justify-between text-center shadow-2xs">
              <div class="text-sm font-bold text-slate-800 mb-2">${it.title}</div>
              <div class="my-1">${badgeHtml(it.status)}</div>
              <p class="text-xs text-slate-500 mt-2">${it.desc}</p>
            </div>
          `).join('')}
        </div>

        <div class="mt-4 grid grid-cols-1 md:grid-cols-2 gap-3 text-xs md:text-sm">
          <div class="p-3.5 rounded-lg bg-blue-50/60 border border-blue-100 text-slate-700">
            <strong>${mA.name}：</strong>${mA.note}
          </div>
          <div class="p-3.5 rounded-lg bg-blue-50/60 border border-blue-100 text-slate-700">
            <strong>${mB.name}：</strong>${mB.note}
          </div>
        </div>
      `;
    }

    // 世代切り替え
    function setEra(era) {
      currentEra = era;
      document.querySelectorAll('.era-btn').forEach(btn => {
        const active = btn.dataset.era === era;
        btn.className = active
          ? "era-btn px-3 py-1.5 rounded-lg text-xs md:text-sm font-semibold bg-blue-600 text-white"
          : "era-btn px-3 py-1.5 rounded-lg text-xs md:text-sm font-semibold bg-slate-100 text-slate-700 hover:bg-slate-200";
      });
      renderMatrix();
    }

    // マトリクス表描画
    function renderMatrix() {
      const list = iphoneModels.filter(m => {
        if (currentEra === 'x_se') return m.era === 'x_se' || m.id === '8' || m.id === '7';
        return m.era === currentEra;
      });

      const table = document.getElementById('matrix-table');
      let html = '<thead><tr class="bg-slate-100 border-b border-slate-300">';
      html += '<th class="p-2.5 text-left font-bold text-slate-700 sticky-col bg-slate-100 min-w-[140px] border-r border-slate-200">機種名</th>';
      list.forEach(col => {
        html += `<th class="p-2 font-semibold text-slate-700 min-w-[76px] border-r border-slate-200 leading-tight">${col.name.replace('iPhone ', '')}</th>`;
      });
      html += '</tr></thead><tbody class="divide-y divide-slate-200">';

      list.forEach(row => {
        html += `<tr class="hover:bg-blue-50/40">`;
        html += `<td class="p-2.5 text-left font-bold text-slate-800 sticky-col bg-white border-r border-slate-200 whitespace-nowrap">${row.name}</td>`;
        list.forEach(col => {
          const st = getCaseStatus(row, col);
          if (st === 'same') {
            html += `<td class="p-2 bg-slate-100 text-slate-400 border-r border-slate-200">-</td>`;
          } else if (st === 'full') {
            html += `<td onclick="jumpToCheck('${row.id}','${col.id}')" title="クリックして4項目判定へ" class="p-2 bg-emerald-50 text-emerald-600 font-extrabold text-base cursor-pointer hover:bg-emerald-100 border-r border-slate-200">◎</td>`;
          } else if (st === 'partial') {
            html += `<td onclick="jumpToCheck('${row.id}','${col.id}')" title="クリックして4項目判定へ" class="p-2 bg-amber-50 text-amber-500 font-extrabold text-base cursor-pointer hover:bg-amber-100 border-r border-slate-200">△</td>`;
          } else {
            html += `<td class="p-2 text-slate-300 border-r border-slate-200">×</td>`;
          }
        });
        html += `</tr>`;
      });
      html += '</tbody>';
      table.innerHTML = html;

      const notesContainer = document.getElementById('era-notes');
      const notedModels = list.filter(m =>
        list.some(other => other.id !== m.id && getCaseStatus(m, other) !== 'none')
      );
      notesContainer.innerHTML = notedModels.length === 0
        ? `<p class="text-slate-500 col-span-2">この世代内で互換性のある組み合わせはありません。</p>`
        : notedModels.map(m => `
            <div class="p-3 rounded-lg bg-slate-50 border border-slate-200">
              <span class="font-bold text-slate-800">${m.name}（${m.inch}"）：</span>
              <span class="text-slate-600">${m.note}</span>
            </div>
          `).join('');
    }

    // 発売年・インチ数 逆引きフィルタ初期化＆描画
    function initSpecFilters() {
      const years = [...new Set(iphoneModels.map(m => m.year))].sort((a, b) => b - a);
      const inches = [...new Set(iphoneModels.map(m => m.inch))].sort((a, b) => b - a);

      const yearSel = document.getElementById('filter-year');
      years.forEach(y => yearSel.add(new Option(`${y}年`, String(y))));

      const inchSel = document.getElementById('filter-inch');
      inches.forEach(i => inchSel.add(new Option(`${i} インチ`, String(i))));

      renderSpecTable();
    }

    function renderSpecTable() {
      const yearVal = document.getElementById('filter-year').value;
      const inchVal = document.getElementById('filter-inch').value;
      const kw = document.getElementById('filter-keyword').value.trim().toLowerCase();

      const rows = iphoneModels.filter(m => {
        if (yearVal !== 'all' && String(m.year) !== yearVal) return false;
        if (inchVal !== 'all' && String(m.inch) !== inchVal) return false;
        if (kw) {
          return m.name.toLowerCase().includes(kw) ||
                 m.keywords.toLowerCase().includes(kw) ||
                 m.connector.toLowerCase().includes(kw) ||
                 String(m.year).includes(kw) ||
                 String(m.inch).includes(kw) ||
                 m.note.toLowerCase().includes(kw);
        }
        return true;
      });

      const tbody = document.getElementById('spec-table-body');
      if (rows.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="py-6 text-center text-slate-500">条件に一致する機種がありません。</td></tr>`;
        return;
      }

      tbody.innerHTML = rows.map(m => `
        <tr class="hover:bg-slate-50">
          <td class="py-3 px-3 font-bold text-slate-900 whitespace-nowrap">${m.name}</td>
          <td class="py-3 px-3 text-slate-700 whitespace-nowrap">${m.year}年</td>
          <td class="py-3 px-3 font-semibold text-blue-700 whitespace-nowrap">${m.inch} インチ</td>
          <td class="py-3 px-3 text-slate-600 whitespace-nowrap">${m.connector}</td>
          <td class="py-3 px-3 text-slate-600">${m.note}</td>
          <td class="py-3 px-3 text-center whitespace-nowrap">
            <button onclick="selectModelForCheck('${m.id}')" class="px-2.5 py-1 rounded bg-blue-50 text-blue-700 hover:bg-blue-100 font-semibold text-xs">
              比較に使う
            </button>
          </td>
        </tr>
      `).join('');
    }

    function selectModelForCheck(modelId) {
      document.getElementById('search-b').value = '';
      filterModelList('b');
      document.getElementById('model-b').value = modelId;
      checkCompatibility();
      switchTab('checker');
    }

    function jumpToCheck(idA, idB) {
      document.getElementById('search-a').value = '';
      document.getElementById('search-b').value = '';
      filterModelList('a');
      filterModelList('b');
      document.getElementById('model-a').value = idA;
      document.getElementById('model-b').value = idB;
      checkCompatibility();
      switchTab('checker');
    }

    function switchTab(tab) {
      document.getElementById('view-checker').classList.toggle('hidden', tab !== 'checker');
      document.getElementById('view-matrix').classList.toggle('hidden', tab !== 'matrix');
      document.getElementById('view-spec').classList.toggle('hidden', tab !== 'spec');

      const map = {
        checker: 'tab-checker',
        matrix: 'tab-matrix',
        spec: 'tab-spec'
      };
      Object.entries(map).forEach(([k, btnId]) => {
        const el = document.getElementById(btnId);
        el.className = (k === tab)
          ? "flex-1 min-w-[140px] py-3.5 font-semibold text-blue-600 border-b-2 border-blue-600 text-xs md:text-base"
          : "flex-1 min-w-[140px] py-3.5 font-semibold text-slate-500 hover:text-slate-700 text-xs md:text-base";
      });
    }

    // 初期起動
    filterModelList('a');
    filterModelList('b');
    document.getElementById('model-a').value = '18p';
    document.getElementById('model-b').value = '17p';
    checkCompatibility();
    renderMatrix();
    initSpecFilters();
  </script>
