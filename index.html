<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iPhone / iPad 周辺機器・ケース互換チェッカー</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-2 md:p-5">
  <div class="max-w-4xl mx-auto">
    <!-- ヘッダー ＆ デバイス切り替え（iPhone / iPad） -->
    <header class="flex flex-wrap items-center justify-between gap-2 mb-3 px-1">
      <div class="flex items-center gap-2">
        <h1 class="text-base md:text-xl font-bold text-slate-900">周辺機器・ケース互換チェッカー</h1>
      </div>

      <!-- デバイス切り替えスイッチ -->
      <div class="inline-flex rounded-lg bg-slate-200 p-1 text-xs md:text-sm font-bold">
        <button id="dev-iphone" onclick="switchDevice('iphone')" class="px-3 py-1 rounded-md bg-white text-blue-700 shadow-2xs transition">
          📱 iPhone
        </button>
        <button id="dev-ipad" onclick="switchDevice('ipad')" class="px-3 py-1 rounded-md text-slate-600 hover:text-slate-900 transition">
          📟 iPad
        </button>
      </div>
    </header>

    <!-- メインタブ（4タブ構成） -->
    <div class="grid grid-cols-4 bg-white rounded-t-xl border border-b-0 border-slate-200 overflow-hidden text-[11px] md:text-sm font-bold">
      <button id="tab-checker" onclick="switchTab('checker')" class="py-2.5 px-1 text-blue-600 border-b-2 border-blue-600 bg-blue-50/40">
        🔍 2機種比較
      </button>
      <button id="tab-single" onclick="switchTab('single')" class="py-2.5 px-1 text-slate-500 hover:text-slate-700 border-b border-slate-200">
        📋 互換一覧
      </button>
      <button id="tab-spec" onclick="switchTab('spec')" class="py-2.5 px-1 text-slate-500 hover:text-slate-700 border-b border-slate-200">
        📅 年・インチ逆引き
      </button>
      <button id="tab-admin" onclick="switchTab('admin')" class="py-2.5 px-1 text-slate-500 hover:text-slate-700 border-b border-slate-200">
        ➕ 新機種追加・管理
      </button>
    </div>

    <!-- ==========================================
         1. 2機種で項目別判定タブ
    =========================================== -->
    <div id="view-checker" class="bg-white p-3.5 md:p-5 rounded-b-xl shadow-xs border border-slate-200">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-3 bg-slate-50 p-3 rounded-xl border border-slate-200">
        <!-- 機種 A -->
        <div>
          <div class="flex items-center justify-between mb-1">
            <label class="text-xs font-bold text-slate-700">機種 A（手持ちケース等）</label>
            <span id="meta-a" class="text-[11px] text-blue-700 font-medium"></span>
          </div>
          <div class="flex gap-1.5">
            <input type="text" id="search-a" oninput="filterSelect('a')" placeholder="英数字検索..."
                   class="w-2/5 p-2 border border-slate-300 rounded-lg bg-white text-xs focus:ring-2 focus:ring-blue-500 outline-none">
            <select id="model-a" onchange="checkCompatibility()"
                    class="w-3/5 p-2 border border-slate-300 rounded-lg bg-white text-xs md:text-sm font-semibold focus:ring-2 focus:ring-blue-500 outline-none"></select>
          </div>
        </div>

        <!-- 機種 B -->
        <div>
          <div class="flex items-center justify-between mb-1">
            <label class="text-xs font-bold text-slate-700">機種 B（使用する本体）</label>
            <span id="meta-b" class="text-[11px] text-blue-700 font-medium"></span>
          </div>
          <div class="flex gap-1.5">
            <input type="text" id="search-b" oninput="filterSelect('b')" placeholder="英数字検索..."
                   class="w-2/5 p-2 border border-slate-300 rounded-lg bg-white text-xs focus:ring-2 focus:ring-blue-500 outline-none">
            <select id="model-b" onchange="checkCompatibility()"
                    class="w-3/5 p-2 border border-slate-300 rounded-lg bg-white text-xs md:text-sm font-semibold focus:ring-2 focus:ring-blue-500 outline-none"></select>
          </div>
        </div>
      </div>

      <!-- ファーストビュー結果エリア（4項目カード） -->
      <div id="result-cards" class="mt-3.5"></div>

      <!-- 詳細メモ -->
      <div id="result-notes" class="mt-3.5 pt-3 border-t border-slate-100"></div>
    </div>

    <!-- ==========================================
         2. 1機種から互換機種を一覧表示タブ
    =========================================== -->
    <div id="view-single" class="hidden bg-white p-3.5 md:p-5 rounded-b-xl shadow-xs border border-slate-200">
      <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 mb-3.5">
        <div class="grid grid-cols-1 md:grid-cols-12 gap-2.5 items-end">
          <div class="md:col-span-7">
            <div class="flex items-center justify-between mb-1">
              <label class="text-xs font-bold text-slate-700">基準となる機種を選択</label>
              <span id="meta-single" class="text-[11px] text-blue-700 font-medium"></span>
            </div>
            <div class="flex gap-1.5">
              <input type="text" id="search-single" oninput="filterSelect('single')" placeholder="英数字で絞り込み..."
                     class="w-2/5 p-2 border border-slate-300 rounded-lg bg-white text-xs focus:ring-2 focus:ring-blue-500 outline-none">
              <select id="model-single" onchange="renderSingleCompat()"
                      class="w-3/5 p-2 border border-slate-300 rounded-lg bg-white text-xs md:text-sm font-semibold focus:ring-2 focus:ring-blue-500 outline-none"></select>
            </div>
          </div>

          <div class="md:col-span-5">
            <label class="block text-xs font-bold text-slate-700 mb-1">表示条件フィルタ</label>
            <select id="single-filter" onchange="renderSingleCompat()"
                    class="w-full p-2 border border-slate-300 rounded-lg bg-white text-xs md:text-sm font-medium focus:ring-2 focus:ring-blue-500 outline-none">
              <option value="any_body">ケース・カメラ・フィルムのいずれかが合う機種</option>
              <option value="case">🛡️ ケースが互換（◎/△）の機種のみ</option>
              <option value="cam">📷 カメラ/Pencilが互換（◎）の機種のみ</option>
              <option value="film">🖼️ 保護フィルムが互換（◎）の機種のみ</option>
              <option value="all">すべて表示（ケーブル互換含む）</option>
            </select>
          </div>
        </div>
      </div>

      <div id="single-summary" class="mb-3"></div>

      <div class="max-h-[55vh] overflow-y-auto border border-slate-200 rounded-lg">
        <table class="w-full text-left border-collapse text-xs md:text-sm">
          <thead class="bg-slate-100 sticky top-0 z-10 border-b border-slate-300 text-slate-700" id="single-thead"></thead>
          <tbody id="single-tbody" class="divide-y divide-slate-200"></tbody>
        </table>
      </div>
    </div>

    <!-- ==========================================
         3. 発売年・インチ数 逆引き表タブ
    =========================================== -->
    <div id="view-spec" class="hidden bg-white p-3.5 md:p-5 rounded-b-xl shadow-xs border border-slate-200">
      <div class="grid grid-cols-3 gap-2 bg-slate-50 p-3 rounded-xl border border-slate-200 mb-3.5">
        <div>
          <label class="block text-[11px] font-bold text-slate-600 mb-1">発売年</label>
          <select id="filter-year" onchange="renderSpecTable()" class="w-full p-2 border border-slate-300 rounded-lg bg-white text-xs md:text-sm">
            <option value="all">すべて</option>
          </select>
        </div>
        <div>
          <label class="block text-[11px] font-bold text-slate-600 mb-1">インチ数</label>
          <select id="filter-inch" onchange="renderSpecTable()" class="w-full p-2 border border-slate-300 rounded-lg bg-white text-xs md:text-sm">
            <option value="all">すべて</option>
          </select>
        </div>
        <div>
          <label class="block text-[11px] font-bold text-slate-600 mb-1">キーワード</label>
          <input type="text" id="filter-keyword" oninput="renderSpecTable()" placeholder="例: 11, pro, air..."
                 class="w-full p-2 border border-slate-300 rounded-lg bg-white text-xs md:text-sm">
        </div>
      </div>

      <div class="max-h-[60vh] overflow-y-auto border border-slate-200 rounded-lg">
        <table class="w-full text-left border-collapse text-xs md:text-sm">
          <thead class="bg-slate-100 sticky top-0 z-10 border-b border-slate-300 text-slate-700">
            <tr>
              <th class="py-2 px-2.5 font-bold">機種名</th>
              <th class="py-2 px-2 font-bold">発売年</th>
              <th class="py-2 px-2 font-bold">インチ</th>
              <th class="py-2 px-2 font-bold">端子</th>
              <th class="py-2 px-2 text-right font-bold">アクション</th>
            </tr>
          </thead>
          <tbody id="spec-tbody" class="divide-y divide-slate-200"></tbody>
        </table>
      </div>
    </div>

    <!-- ==========================================
         4. 新機種追加・管理タブ（引き継ぎ対応）
    =========================================== -->
    <div id="view-admin" class="hidden bg-white p-3.5 md:p-5 rounded-b-xl shadow-xs border border-slate-200 space-y-5">
      <!-- 新機種追加フォーム -->
      <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
        <h2 class="text-sm font-bold text-slate-900 mb-1">➕ 新しい機種を追加する</h2>
        <p class="text-xs text-slate-500 mb-3">
          「同じ形状の既存機種」を選ぶだけで、ケース・フィルム等の互換グループが自動設定されます。
        </p>

        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-2.5 mb-3">
          <div>
            <label class="block text-[11px] font-bold text-slate-700 mb-1">対象デバイス</label>
            <select id="add-device" onchange="updateAdminReferenceOptions()" class="w-full p-2 border border-slate-300 rounded-lg bg-white text-xs md:text-sm font-semibold">
              <option value="iphone">📱 iPhone</option>
              <option value="ipad">📟 iPad</option>
            </select>
          </div>
          <div>
            <label class="block text-[11px] font-bold text-slate-700 mb-1">機種名 *</label>
            <input type="text" id="add-name" placeholder="例: iPhone 19 Pro / iPad Air M4" class="w-full p-2 border border-slate-300 rounded-lg bg-white text-xs md:text-sm">
          </div>
          <div>
            <label class="block text-[11px] font-bold text-slate-700 mb-1">発売年 *</label>
            <input type="number" id="add-year" value="2026" class="w-full p-2 border border-slate-300 rounded-lg bg-white text-xs md:text-sm">
          </div>
          <div>
            <label class="block text-[11px] font-bold text-slate-700 mb-1">画面インチ数 *</label>
            <input type="number" step="0.1" id="add-inch" placeholder="例: 6.3" class="w-full p-2 border border-slate-300 rounded-lg bg-white text-xs md:text-sm">
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-2.5 mb-3">
          <div>
            <label class="block text-[11px] font-bold text-slate-700 mb-1">充電端子</label>
            <select id="add-connector" class="w-full p-2 border border-slate-300 rounded-lg bg-white text-xs md:text-sm">
              <option value="USB-C">USB-C</option>
              <option value="Lightning">Lightning</option>
              <option value="30-pin Dock">30-pin Dock</option>
            </select>
          </div>
          <div>
            <label class="block text-[11px] font-bold text-slate-700 mb-1">🛡️ ケース互換の基準</label>
            <select id="add-ref-case" class="w-full p-2 border border-slate-300 rounded-lg bg-white text-xs md:text-sm"></select>
          </div>
          <div>
            <label class="block text-[11px] font-bold text-slate-700 mb-1">🖼️ フィルム互換の基準</label>
            <select id="add-ref-film" class="w-full p-2 border border-slate-300 rounded-lg bg-white text-xs md:text-sm"></select>
          </div>
          <div>
            <label class="block text-[11px] font-bold text-slate-700 mb-1" id="add-ref-cam-label">📷 カメラカバー互換の基準</label>
            <select id="add-ref-cam" class="w-full p-2 border border-slate-300 rounded-lg bg-white text-xs md:text-sm"></select>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-12 gap-2.5 items-end">
          <div class="md:col-span-9">
            <label class="block text-[11px] font-bold text-slate-700 mb-1">検索用キーワード・注意点メモ</label>
            <input type="text" id="add-note" placeholder="例: 外寸は前モデルと同じだがカメラ枠が拡大。" class="w-full p-2 border border-slate-300 rounded-lg bg-white text-xs md:text-sm">
          </div>
          <div class="md:col-span-3">
            <button onclick="addNewModel()" class="w-full py-2 px-4 rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs md:text-sm transition">
              ＋ リストに追加する
            </button>
          </div>
        </div>
        <div id="add-feedback" class="mt-2 text-xs font-semibold text-emerald-700"></div>
      </div>

      <!-- 追加済みカスタム機種一覧 ＆ データ引き継ぎ・外部JSON同期 -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- カスタム追加リスト -->
        <div class="border border-slate-200 rounded-xl p-3.5">
          <div class="flex items-center justify-between mb-2">
            <h3 class="text-xs font-bold text-slate-800">📝 このブラウザで追加・編集した機種</h3>
            <button onclick="resetCustomData()" class="text-[11px] text-rose-600 hover:underline">初期状態に戻す</button>
          </div>
          <div id="custom-list" class="max-h-44 overflow-y-auto divide-y divide-slate-100 text-xs"></div>
        </div>

        <!-- 管理者引き継ぎ・GitHub共有用エクスポート/インポート -->
        <div class="border border-slate-200 rounded-xl p-3.5 bg-amber-50/40">
          <h3 class="text-xs font-bold text-slate-800 mb-1">🔄 管理者引き継ぎ・全ユーザー反映用データ</h3>
          <p class="text-[11px] text-slate-600 mb-2.5 leading-relaxed">
            手入力した内容は現在のブラウザに自動保存されます。他スタッフの端末やVercel本番サイト全体へ反映する場合は、下のボタンでJSONを書き出してGitHubの <code class="bg-white px-1 border rounded">models.json</code>（またはコード内）に上書きしてください。
          </p>
          <div class="flex flex-wrap gap-2">
            <button onclick="exportJsonFile()" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-900 text-white font-semibold text-xs">
              ⬇️ models.json をダウンロード
            </button>
            <button onclick="copyJsonToClipboard()" class="px-3 py-1.5 rounded-lg bg-white border border-slate-300 hover:bg-slate-50 text-slate-800 font-semibold text-xs">
              📋 JSONをコピー
            </button>
            <label class="px-3 py-1.5 rounded-lg bg-white border border-slate-300 hover:bg-slate-50 text-slate-800 font-semibold text-xs cursor-pointer">
              ⬆️ JSON読込
              <input type="file" accept=".json" onchange="importJsonFile(event)" class="hidden">
            </label>
          </div>
          <div id="export-feedback" class="mt-2 text-[11px] font-semibold text-blue-700"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ============================================================
    // 初期マスターデータ（iPhone ＆ iPad 全世代）
    // ============================================================

          note: "mini 5とフィルム共通。" }
      ]
    };

    const STORAGE_KEY = "compat_checker_custom_models_v1";
    let appData = { iphone: [], ipad: [] };
    let currentDevice = "iphone"; // 'iphone' or 'ipad'

    // ============================================================
    // データ読み込み・保存管理（LocalStorage + 外部models.json対応）
    // ============================================================
    function loadAppData() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          appData.iphone = [...(parsed.customIphone || []), ...DEFAULT_DATA.iphone];
          appData.ipad = [...(parsed.customIpad || []), ...DEFAULT_DATA.ipad];
          return;
        } catch (e) {
          console.error("Saved data parse error", e);
        }
      }
      appData.iphone = [...DEFAULT_DATA.iphone];
      appData.ipad = [...DEFAULT_DATA.ipad];
    }

    function getCustomStorage() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || { customIphone: [], customIpad: [] };
      } catch {
        return { customIphone: [], customIpad: [] };
      }
    }

    function saveCustomStorage(obj) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(obj));
      loadAppData();
    }

    function getModels() {
      return appData[currentDevice];
    }

    // ============================================================
    // 判定ロジック
    // ============================================================
    function compareGroup(a, b, fullProp, partialProp = null) {
      if (a.id === b.id) return 'full';
      if (a[fullProp] && b[fullProp] && a[fullProp] === b[fullProp]) return 'full';
      if (partialProp && a[partialProp] && b[partialProp] && a[partialProp] === b[partialProp]) return 'partial';
      return 'none';
    }

    function getStatuses(a, b) {
      return {
        caseSt: compareGroup(a, b, 'caseGroup', 'casePartial'),
        camSt: compareGroup(a, b, 'camGroup'),
        filmSt: compareGroup(a, b, 'filmGroup'),
        cableSt: compareGroup(a, b, 'cableGroup')
      };
    }

    function getLabelsForDevice() {
      if (currentDevice === 'ipad') {
        return {
          col3: "✏️Pencil",
          card3Title: "✏️ Apple Pencil",
          card3Ok: "対応Pencil規格が一致",
          card3Ng: "対応Pencil規格が不一致"
        };
      }
      return {
        col3: "📷カメラ",
        card3Title: "📷 カメラカバー",
        card3Ok: "レンズ・台座一致",
        card3Ng: "レンズ配置不一致"
      };
    }

    function cardBadge(st) {
      if (st === 'full') return `<span class="inline-block px-2.5 py-0.5 rounded-full bg-emerald-100 text-emerald-700 font-extrabold text-xs md:text-sm">◎ 互換あり</span>`;
      if (st === 'partial') return `<span class="inline-block px-2.5 py-0.5 rounded-full bg-amber-100 text-amber-700 font-extrabold text-xs md:text-sm">△ 条件付き</span>`;
      return `<span class="inline-block px-2.5 py-0.5 rounded-full bg-rose-100 text-rose-700 font-extrabold text-xs md:text-sm">× 非互換</span>`;
    }

    function symbolBadge(st) {
      if (st === 'full') return `<span class="inline-flex items-center justify-center w-6 h-6 rounded-full bg-emerald-100 text-emerald-700 font-extrabold text-xs">◎</span>`;
      if (st === 'partial') return `<span class="inline-flex items-center justify-center w-6 h-6 rounded-full bg-amber-100 text-amber-600 font-extrabold text-xs">△</span>`;
      return `<span class="text-slate-300 font-bold text-xs">×</span>`;
    }

    // ============================================================
    // デバイス切り替え（iPhone ⇔ iPad）
    // ============================================================
    function switchDevice(dev) {
      currentDevice = dev;
      document.getElementById('dev-iphone').className = dev === 'iphone'
        ? "px-3 py-1 rounded-md bg-white text-blue-700 shadow-2xs transition"
        : "px-3 py-1 rounded-md text-slate-600 hover:text-slate-900 transition";
      document.getElementById('dev-ipad').className = dev === 'ipad'
        ? "px-3 py-1 rounded-md bg-white text-blue-700 shadow-2xs transition"
        : "px-3 py-1 rounded-md text-slate-600 hover:text-slate-900 transition";

      ['a', 'b', 'single'].forEach(k => {
        document.getElementById(`search-${k}`).value = '';
        filterSelect(k);
      });

      const list = getModels();
      if (list.length >= 2) {
        document.getElementById('model-a').selectedIndex = 0;
        document.getElementById('model-b').selectedIndex = 1;
        document.getElementById('model-single').selectedIndex = 0;
      }

      checkCompatibility();
      renderSingleCompat();
      initSpecFilters();
    }

    // ============================================================
    // ドロップダウン絞り込み
    // ============================================================
    function filterSelect(key) {
      const q = document.getElementById(`search-${key}`).value.trim().toLowerCase();
      const sel = document.getElementById(`model-${key}`);
      const prev = sel.value;
      const list = getModels();

      const filtered = list.filter(m =>
        !q ||
        m.name.toLowerCase().includes(q) ||
        (m.keywords && m.keywords.toLowerCase().includes(q)) ||
        String(m.year).includes(q) ||
        String(m.inch).includes(q)
      );

      sel.innerHTML = '';
      filtered.forEach(m => {
        sel.add(new Option(`${m.name} (${m.year} / ${m.inch}")`, m.id));
      });

      if (filtered.length > 0) {
        if (filtered.some(m => m.id === prev)) sel.value = prev;
        else sel.selectedIndex = 0;
      }

      if (key === 'single') renderSingleCompat();
      else checkCompatibility();
    }

    // ============================================================
    // 1. 2機種比較ロジック
    // ============================================================
    function checkCompatibility() {
      const idA = document.getElementById('model-a').value;
      const idB = document.getElementById('model-b').value;
      const cardsEl = document.getElementById('result-cards');
      const notesEl = document.getElementById('result-notes');
      const list = getModels();

      if (!idA || !idB) {
        cardsEl.innerHTML = `<div class="p-4 rounded-xl bg-slate-100 text-center text-xs text-slate-500">一致する機種がありません</div>`;
        notesEl.innerHTML = '';
        return;
      }

      const mA = list.find(m => m.id === idA);
      const mB = list.find(m => m.id === idB);
      const lbl = getLabelsForDevice();

      document.getElementById('meta-a').textContent = `${mA.year}年 / ${mA.inch}" / ${mA.connector}`;
      document.getElementById('meta-b').textContent = `${mB.year}年 / ${mB.inch}" / ${mB.connector}`;

      const st = getStatuses(mA, mB);
      const items = [
        { title: "🛡️ ケース", st: st.caseSt, sub: st.caseSt === 'full' ? "外寸・枠一致" : st.caseSt === 'partial' ? "条件付き流用可" : "サイズ・枠不一致" },
        { title: lbl.card3Title, st: st.camSt, sub: st.camSt === 'full' ? lbl.card3Ok : lbl.card3Ng },
        { title: "🖼️ 保護フィルム", st: st.filmSt, sub: st.filmSt === 'full' ? "画面・枠一致" : "画面形状不一致" },
        { title: "🔌 充電ケーブル", st: st.cableSt, sub: st.cableSt === 'full' ? `${mA.connector} 一致` : `${mA.connector} ≠ ${mB.connector}` }
      ];

      cardsEl.innerHTML = `
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
          ${items.map(it => `
            <div class="p-3 rounded-xl border ${it.st === 'full' ? 'border-emerald-200 bg-emerald-50/30' : it.st === 'partial' ? 'border-amber-200 bg-amber-50/30' : 'border-slate-200 bg-slate-50/50'} text-center">
              <div class="text-xs font-bold text-slate-700 mb-1.5">${it.title}</div>
              <div>${cardBadge(it.st)}</div>
              <div class="text-[11px] text-slate-500 mt-1.5">${it.sub}</div>
            </div>
          `).join('')}
        </div>
      `;

      notesEl.innerHTML = `
        <div class="grid grid-cols-1 md:grid-cols-2 gap-2 text-xs text-slate-600">
          <div class="p-2.5 rounded-lg bg-slate-50 border border-slate-200">
            <strong class="text-slate-800">${mA.name}：</strong>${mA.note || '特記事項なし'}
          </div>
          <div class="p-2.5 rounded-lg bg-slate-50 border border-slate-200">
            <strong class="text-slate-800">${mB.name}：</strong>${mB.note || '特記事項なし'}
          </div>
        </div>
      `;
    }

    // ============================================================
    // 2. 1機種から互換機種一覧ロジック
    // ============================================================
    function renderSingleCompat() {
      const baseId = document.getElementById('model-single').value;
      const filterMode = document.getElementById('single-filter').value;
      const thead = document.getElementById('single-thead');
      const tbody = document.getElementById('single-tbody');
      const summaryEl = document.getElementById('single-summary');
      const list = getModels();
      const lbl = getLabelsForDevice();

      thead.innerHTML = `
        <tr>
          <th class="py-2 px-2.5 font-bold">互換候補の機種</th>
          <th class="py-2 px-1.5 text-center font-bold">🛡️ケース</th>
          <th class="py-2 px-1.5 text-center font-bold">${lbl.col3}</th>
          <th class="py-2 px-1.5 text-center font-bold">🖼️フィルム</th>
          <th class="py-2 px-1.5 text-center font-bold">🔌ケーブル</th>
          <th class="py-2 px-2 text-right font-bold">詳細</th>
        </tr>
      `;

      if (!baseId) {
        tbody.innerHTML = `<tr><td colspan="6" class="py-6 text-center text-slate-400">機種が見つかりません</td></tr>`;
        summaryEl.innerHTML = '';
        return;
      }

      const base = list.find(m => m.id === baseId);
      document.getElementById('meta-single').textContent = `${base.year}年 / ${base.inch}" / ${base.connector}`;

      summaryEl.innerHTML = `
        <div class="p-2.5 rounded-lg bg-blue-50/70 border border-blue-200 text-xs text-slate-700">
          <strong class="text-blue-900">${base.name}（${base.year}年・${base.inch}インチ）：</strong>${base.note || '特記事項なし'}
        </div>
      `;

      const candidates = list
        .filter(m => m.id !== base.id)
        .map(m => ({ model: m, st: getStatuses(base, m) }))
        .filter(({ st }) => {
          if (filterMode === 'case') return st.caseSt !== 'none';
          if (filterMode === 'cam') return st.camSt !== 'none';
          if (filterMode === 'film') return st.filmSt !== 'none';
          if (filterMode === 'any_body') {
            return st.caseSt !== 'none' || st.camSt !== 'none' || st.filmSt !== 'none';
          }
          return true;
        });

      if (candidates.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="6" class="py-6 text-center text-xs text-slate-500">
              この条件で互換性のある他機種はありません（専用設計モデルです）。
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = candidates.map(({ model, st }) => `
        <tr class="hover:bg-slate-50">
          <td class="py-2 px-2.5">
            <div class="font-bold text-slate-900">${model.name}</div>
            <div class="text-[11px] text-slate-400">${model.year}年 / ${model.inch}"</div>
          </td>
          <td class="py-2 px-1.5 text-center">${symbolBadge(st.caseSt)}</td>
          <td class="py-2 px-1.5 text-center">${symbolBadge(st.camSt)}</td>
          <td class="py-2 px-1.5 text-center">${symbolBadge(st.filmSt)}</td>
          <td class="py-2 px-1.5 text-center">${symbolBadge(st.cableSt)}</td>
          <td class="py-2 px-2 text-right whitespace-nowrap">
            <button onclick="jumpToCompare('${base.id}', '${model.id}')"
                    class="px-2 py-1 rounded bg-blue-50 text-blue-700 hover:bg-blue-100 font-semibold text-[11px]">
              2機種比較へ
            </button>
          </td>
        </tr>
      `).join('');
    }

    // ============================================================
    // 3. 発売年・インチ数 逆引き表ロジック
    // ============================================================
    function initSpecFilters() {
      const list = getModels();
      const years = [...new Set(list.map(m => m.year))].sort((a, b) => b - a);
      const inches = [...new Set(list.map(m => m.inch))].sort((a, b) => b - a);

      const ySel = document.getElementById('filter-year');
      ySel.innerHTML = '<option value="all">すべて</option>';
      years.forEach(y => ySel.add(new Option(`${y}年`, String(y))));

      const iSel = document.getElementById('filter-inch');
      iSel.innerHTML = '<option value="all">すべて</option>';
      inches.forEach(i => iSel.add(new Option(`${i} インチ`, String(i))));

      renderSpecTable();
    }

    function renderSpecTable() {
      const list = getModels();
      const yVal = document.getElementById('filter-year').value;
      const iVal = document.getElementById('filter-inch').value;
      const kw = document.getElementById('filter-keyword').value.trim().toLowerCase();

      const rows = list.filter(m => {
        if (yVal !== 'all' && String(m.year) !== yVal) return false;
        if (iVal !== 'all' && String(m.inch) !== iVal) return false;
        if (kw) {
          return m.name.toLowerCase().includes(kw) ||
                 (m.keywords && m.keywords.toLowerCase().includes(kw)) ||
                 m.connector.toLowerCase().includes(kw) ||
                 String(m.year).includes(kw) ||
                 String(m.inch).includes(kw);
        }
        return true;
      });

      const tbody = document.getElementById('spec-tbody');
      if (rows.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="py-6 text-center text-slate-400">一致する機種がありません</td></tr>`;
        return;
      }

      tbody.innerHTML = rows.map(m => `
        <tr class="hover:bg-slate-50">
          <td class="py-2 px-2.5 font-bold text-slate-900 whitespace-nowrap">${m.name}</td>
          <td class="py-2 px-2 text-slate-600 whitespace-nowrap">${m.year}年</td>
          <td class="py-2 px-2 font-semibold text-blue-700 whitespace-nowrap">${m.inch}"</td>
          <td class="py-2 px-2 text-slate-600 whitespace-nowrap">${m.connector}</td>
          <td class="py-2 px-2 text-right whitespace-nowrap space-x-1">
            <button onclick="jumpToSingle('${m.id}')" class="px-2 py-1 rounded bg-emerald-50 text-emerald-700 hover:bg-emerald-100 font-semibold text-[11px]">
              互換一覧
            </button>
            <button onclick="jumpToCompare('${m.id}', '${list[0].id}')" class="px-2 py-1 rounded bg-blue-50 text-blue-700 hover:bg-blue-100 font-semibold text-[11px]">
              比較へ
            </button>
          </td>
        </tr>
      `).join('');
    }

    // ============================================================
    // 4. 新機種追加・管理タブ ロジック
    // ============================================================
    function updateAdminReferenceOptions() {
      const dev = document.getElementById('add-device').value;
      const list = appData[dev];
      document.getElementById('add-ref-cam-label').textContent =
        dev === 'ipad' ? "✏️ Apple Pencil互換の基準" : "📷 カメラカバー互換の基準";

      const caseSel = document.getElementById('add-ref-case');
      const filmSel = document.getElementById('add-ref-film');
      const camSel = document.getElementById('add-ref-cam');

      caseSel.innerHTML = '<option value="NEW">新規独自サイズ（他と非互換）</option>';
      filmSel.innerHTML = '<option value="NEW">新規独自サイズ（他と非互換）</option>';
      camSel.innerHTML = '<option value="NEW">新規独自規格（他と非互換）</option>';

      list.forEach(m => {
        caseSel.add(new Option(`${m.name} と同じ`, m.caseGroup));
        filmSel.add(new Option(`${m.name} と同じ`, m.filmGroup));
        camSel.add(new Option(`${m.name} と同じ`, m.camGroup));
      });
    }

    function addNewModel() {
      const dev = document.getElementById('add-device').value;
      const name = document.getElementById('add-name').value.trim();
      const year = parseInt(document.getElementById('add-year').value, 10);
      const inch = parseFloat(document.getElementById('add-inch').value);
      const connector = document.getElementById('add-connector').value;
      const refCase = document.getElementById('add-ref-case').value;
      const refFilm = document.getElementById('add-ref-film').value;
      const refCam = document.getElementById('add-ref-cam').value;
      const note = document.getElementById('add-note').value.trim();
      const fb = document.getElementById('add-feedback');

      if (!name || isNaN(year) || isNaN(inch)) {
        fb.className = "mt-2 text-xs font-semibold text-rose-600";
        fb.textContent = "※ 機種名・発売年・インチ数は必須入力です。";
        return;
      }

      const uid = "custom_" + Date.now();
      const newObj = {
        id: uid,
        name,
        keywords: `${name.toLowerCase()} ${year} ${inch}`,
        year,
        inch,
        connector,
        caseGroup: refCase === "NEW" ? `c_${uid}` : refCase,
        camGroup: refCam === "NEW" ? `cam_${uid}` : refCam,
        filmGroup: refFilm === "NEW" ? `f_${uid}` : refFilm,
        cableGroup: connector === "USB-C" ? "usbc" : connector === "Lightning" ? "lightning" : "dock30",
        note: note || `${year}年発売・${inch}インチモデル。`,
        isCustom: true
      };

      const stored = getCustomStorage();
      if (dev === 'iphone') stored.customIphone.unshift(newObj);
      else stored.customIpad.unshift(newObj);

      saveCustomStorage(stored);

      // フォーム初期化・画面反映
      document.getElementById('add-name').value = '';
      document.getElementById('add-note').value = '';
      fb.className = "mt-2 text-xs font-semibold text-emerald-700";
      fb.textContent = `✅ 「${name}」を追加しました！すでに比較・一覧タブから選択できます。`;

      renderCustomList();
      updateAdminReferenceOptions();
      if (currentDevice === dev) {
        switchDevice(dev);
      }
    }

    function deleteCustomModel(dev, id) {
      const stored = getCustomStorage();
      if (dev === 'iphone') stored.customIphone = stored.customIphone.filter(m => m.id !== id);
      else stored.customIpad = stored.customIpad.filter(m => m.id !== id);
      saveCustomStorage(stored);
      renderCustomList();
      updateAdminReferenceOptions();
      if (currentDevice === dev) switchDevice(dev);
    }

    function resetCustomData() {
      if (!confirm("このブラウザで追加したカスタム機種をすべて削除して初期状態に戻しますか？")) return;
      localStorage.removeItem(STORAGE_KEY);
      loadAppData();
      renderCustomList();
      updateAdminReferenceOptions();
      switchDevice(currentDevice);
    }

    function renderCustomList() {
      const stored = getCustomStorage();
      const allCustom = [
        ...stored.customIphone.map(m => ({ ...m, dev: 'iphone', devLabel: '📱iPhone' })),
        ...stored.customIpad.map(m => ({ ...m, dev: 'ipad', devLabel: '📟iPad' }))
      ];
      const box = document.getElementById('custom-list');
      if (allCustom.length === 0) {
        box.innerHTML = `<p class="py-4 text-center text-slate-400">まだ追加された機種はありません</p>`;
        return;
      }
      box.innerHTML = allCustom.map(m => `
        <div class="py-2 flex items-center justify-between gap-2">
          <div>
            <span class="px-1.5 py-0.5 rounded bg-slate-100 text-[10px] font-bold mr-1">${m.devLabel}</span>
            <span class="font-bold text-slate-800">${m.name}</span>
            <span class="text-slate-400">(${m.year} / ${m.inch}")</span>
          </div>
          <button onclick="deleteCustomModel('${m.dev}', '${m.id}')" class="text-rose-600 hover:underline font-semibold">削除</button>
        </div>
      `).join('');
    }

    function exportJsonFile() {
      const blob = new Blob([JSON.stringify(appData, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = "models.json";
      a.click();
      URL.revokeObjectURL(url);
      document.getElementById('export-feedback').textContent = "✅ models.json をダウンロードしました。";
    }

    function copyJsonToClipboard() {
      navigator.clipboard.writeText(JSON.stringify(appData, null, 2)).then(() => {
        document.getElementById('export-feedback').textContent = "✅ 全機種データをクリップボードにコピーしました。";
      });
    }

    function importJsonFile(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        try {
          const parsed = JSON.parse(ev.target.result);
          if (!parsed.iphone || !parsed.ipad) throw new Error("Invalid format");
          const defaultIphoneIds = new Set(DEFAULT_DATA.iphone.map(m => m.id));
          const defaultIpadIds = new Set(DEFAULT_DATA.ipad.map(m => m.id));
          saveCustomStorage({
            customIphone: parsed.iphone.filter(m => !defaultIphoneIds.has(m.id)),
            customIpad: parsed.ipad.filter(m => !defaultIpadIds.has(m.id))
          });
          renderCustomList();
          switchDevice(currentDevice);
          document.getElementById('export-feedback').textContent = "✅ JSONデータを読み込みました！";
        } catch {
          alert("JSONファイルの形式が正しくありません。");
        }
      };
      reader.readAsText(file);
    }

    // ============================================================
    // 画面遷移・初期化
    // ============================================================
    function jumpToCompare(idA, idB) {
      document.getElementById('search-a').value = '';
      document.getElementById('search-b').value = '';
      filterSelect('a');
      filterSelect('b');
      document.getElementById('model-a').value = idA;
      document.getElementById('model-b').value = idB;
      checkCompatibility();
      switchTab('checker');
    }

    function jumpToSingle(id) {
      document.getElementById('search-single').value = '';
      filterSelect('single');
      document.getElementById('model-single').value = id;
      renderSingleCompat();
      switchTab('single');
    }

    function switchTab(tab) {
      ['checker', 'single', 'spec', 'admin'].forEach(t => {
        const isCurrent = t === tab;
        document.getElementById(`view-${t}`).classList.toggle('hidden', !isCurrent);
        document.getElementById(`tab-${t}`).className = isCurrent
          ? "py-2.5 px-1 text-blue-600 border-b-2 border-blue-600 bg-blue-50/40"
          : "py-2.5 px-1 text-slate-500 hover:text-slate-700 border-b border-slate-200";
      });
    }

    // 起動処理
    loadAppData();
    switchDevice('iphone');
    updateAdminReferenceOptions();
    renderCustomList();
  </script>
</body>
</html>
