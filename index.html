<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スマホケース互換性チェッカー</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4 md:p-8">
  <div class="max-w-3xl mx-auto">
    <header class="mb-8 text-center">
      <h1 class="text-2xl md:text-3xl font-bold text-slate-900">📱 スマホケース互換性チェッカー</h1>
      <p class="text-sm text-slate-500 mt-2">2つの機種を選んでケースが使い回せるか即時判定＆一覧表</p>
    </header>

    <!-- タブ切り替え -->
    <div class="flex border-b border-slate-200 mb-6">
      <button id="tab-checker" onclick="switchTab('checker')" class="flex-1 py-3 font-semibold text-blue-600 border-b-2 border-blue-600">
        🔍 2機種で即時判定
      </button>
      <button id="tab-table" onclick="switchTab('table')" class="flex-1 py-3 font-semibold text-slate-500 hover:text-slate-700">
        📋 互換性一覧表
      </button>
    </div>

    <!-- 1. 2機種比較チェッカー画面 -->
    <div id="view-checker" class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 items-center">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">機種 A（手持ちのケースなど）</label>
          <select id="model-a" onchange="checkCompatibility()" class="w-full p-3 border border-slate-300 rounded-lg bg-white focus:ring-2 focus:ring-blue-500 outline-none"></select>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">機種 B（使いたい本体など）</label>
          <select id="model-b" onchange="checkCompatibility()" class="w-full p-3 border border-slate-300 rounded-lg bg-white focus:ring-2 focus:ring-blue-500 outline-none"></select>
        </div>
      </div>

      <!-- 判定結果表示エリア -->
      <div id="result-box" class="mt-6 p-5 rounded-lg text-center transition-all">
        <!-- JSで動的に描画 -->
      </div>
    </div>

    <!-- 2. 互換性一覧表画面 -->
    <div id="view-table" class="hidden bg-white p-6 rounded-xl shadow-sm border border-slate-200">
      <div class="mb-4">
        <input type="text" id="search-input" onkeyup="renderTable()" placeholder="機種名で検索（例: iPhone 14, SE, Pixel...）" class="w-full p-3 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="border-b-2 border-slate-200 text-sm text-slate-600">
              <th class="py-3 px-4">グループ / サイズ</th>
              <th class="py-3 px-4">互換性のある機種一覧</th>
              <th class="py-3 px-4">注意点・備考</th>
            </tr>
          </thead>
          <tbody id="table-body" class="divide-y divide-slate-100 text-sm">
            <!-- JSで動的に描画 -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // ▼ 互換性データ（ここを編集・追加するだけで全画面に反映されます）
    const compatibilityGroups = [
      {
        id: "iphone-se-47",
        name: "iPhone 4.7インチ共通グループ",
        models: ["iPhone 7", "iPhone 8", "iPhone SE (第2世代)", "iPhone SE (第3世代)"],
        note: "基本形状は完全一致。ただしiPhone 7と8以降ではAppleロゴの位置が少し異なります。"
      },
      {
        id: "iphone-12-61",
        name: "iPhone 12 / 12 Pro (6.1インチ)",
        models: ["iPhone 12", "iPhone 12 Pro"],
        note: "カメラ枠・ボタン位置ともに完全互換です。"
      },
      {
        id: "iphone-13-14",
        name: "iPhone 13 / 14 (6.1インチ)",
        models: ["iPhone 13", "iPhone 14"],
        note: "厚みが0.15mm異なりますが、大半のソフトケース・ハードケースで併用可能です（厳密な設計のケースは注意）。"
      },
      {
        id: "iphone-14-15-16e",
        name: "iPhone 16e (6.1インチ)",
        models: ["iPhone 16e"],
        note: "単眼カメラのため、iPhone 14/15などの複数レンズ用ケースはカメラ枠が余ります。"
      },
      {
        id: "pixel-6a",
        name: "Google Pixel 6a",
        models: ["Google Pixel 6a"],
        note: "Pixel 6 / 7とはサイズ・カメラバーの厚みが異なるため互換性はありません。"
      },
      {
        id: "pixel-9-pro",
        name: "Google Pixel 9 / 9 Pro",
        models: ["Google Pixel 9", "Google Pixel 9 Pro"],
        note: "本体寸法・カメラバー形状が共通のためケースの使い回しが可能です。"
      }
    ];

    // 初期化処理
    function init() {
      const selectA = document.getElementById('model-a');
      const selectB = document.getElementById('model-b');
      
      // 全機種リストを抽出
      const allModels = [];
      compatibilityGroups.forEach(group => {
        group.models.forEach(model => {
          allModels.push({ model, groupId: group.id });
        });
      });

      allModels.forEach((item, index) => {
        const optA = new Option(item.model, item.model);
        const optB = new Option(item.model, item.model);
        selectA.add(optA);
        selectB.add(optB);
      });

      // 初期選択を別の機種にしておく
      if (allModels.length > 1) {
        selectB.selectedIndex = 1;
      }

      checkCompatibility();
      renderTable();
    }

    // 2機種の互換性判定
    function checkCompatibility() {
      const modelA = document.getElementById('model-a').value;
      const modelB = document.getElementById('model-b').value;
      const resultBox = document.getElementById('result-box');

      if (modelA === modelB) {
        resultBox.className = "mt-6 p-5 rounded-lg text-center bg-slate-100 border border-slate-300";
        resultBox.innerHTML = `<p class="text-lg font-bold text-slate-700">同じ機種が選択されています</p><p class="text-sm text-slate-500 mt-1">別の機種を選んで比較してください。</p>`;
        return;
      }

      const groupA = compatibilityGroups.find(g => g.models.includes(modelA));
      const groupB = compatibilityGroups.find(g => g.models.includes(modelB));

      if (groupA && groupB && groupA.id === groupB.id) {
        resultBox.className = "mt-6 p-5 rounded-lg text-center bg-emerald-50 border border-emerald-300";
        resultBox.innerHTML = `
          <div class="text-3xl mb-2">⭕ 互換性あり！</div>
          <p class="font-bold text-emerald-900">「${modelA}」と「${modelB}」は同じケースが使えます</p>
          <p class="text-sm text-emerald-700 mt-2 bg-white/70 p-2 rounded inline-block">💡 ${groupA.note}</p>
        `;
      } else {
        resultBox.className = "mt-6 p-5 rounded-lg text-center bg-rose-50 border border-rose-300";
        resultBox.innerHTML = `
          <div class="text-3xl mb-2">❌ 互換性なし</div>
          <p class="font-bold text-rose-900">「${modelA}」と「${modelB}」のケースは使い回せません</p>
          <p class="text-sm text-rose-700 mt-1">カメラ位置・ボタン配置・本体サイズのいずれかが異なります。</p>
        `;
      }
    }

    // 一覧表の描画・検索フィルタ
    function renderTable() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = '';

      compatibilityGroups.forEach(group => {
        const match = group.name.toLowerCase().includes(query) || 
                      group.models.some(m => m.toLowerCase().includes(query)) ||
                      group.note.toLowerCase().includes(query);
        if (!match) return;

        const tr = document.createElement('tr');
        tr.className = "hover:bg-slate-50";
        tr.innerHTML = `
          <td class="py-3 px-4 font-semibold text-slate-800">${group.name}</td>
          <td class="py-3 px-4">
            <div class="flex flex-wrap gap-1">
              ${group.models.map(m => `<span class="bg-blue-100 text-blue-800 text-xs font-medium px-2.5 py-0.5 rounded">${m}</span>`).join('')}
            </div>
          </td>
          <td class="py-3 px-4 text-slate-600">${group.note}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    // タブ切り替え処理
    function switchTab(tab) {
      const isChecker = tab === 'checker';
      document.getElementById('view-checker').classList.toggle('hidden', !isChecker);
      document.getElementById('view-table').classList.toggle('hidden', isChecker);
      
      document.getElementById('tab-checker').className = isChecker 
        ? "flex-1 py-3 font-semibold text-blue-600 border-b-2 border-blue-600" 
        : "flex-1 py-3 font-semibold text-slate-500 hover:text-slate-700";
      document.getElementById('tab-table').className = !isChecker 
        ? "flex-1 py-3 font-semibold text-blue-600 border-b-2 border-blue-600" 
        : "flex-1 py-3 font-semibold text-slate-500 hover:text-slate-700";
    }

    init();
  </script>
</body>
</html>
